<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift Cards - The December Box</title>
<style>
  :root { --green:#173b2b; --cream:#f7f2e8; --gold:#c9a45b; }
  body { background:var(--cream); color:var(--green); font-family:Georgia, serif; max-width:600px; margin:0 auto; padding:20px; }
 .card-box { background:white; border:2px solid var(--green); border-radius:16px; padding:24px; margin:20px 0; }
 .toggle { display:flex; gap:10px; margin:15px 0; }
 .toggle button { flex:1; padding:12px; border:2px solid var(--green); background:white; cursor:pointer; border-radius:8px; font-weight:bold; }
 .toggle button.active { background:var(--green); color:var(--cream); }
 .price-line { display:flex; justify-content:space-between; margin:6px 0; }
 .total { font-size:22px; font-weight:bold; border-top:1px solid var(--gold); padding-top:10px; margin-top:10px; }
  input, select { width:100%; padding:12px; border:1px solid var(--gold); border-radius:8px; margin:8px 0; box-sizing:border-box; }
 .btn { background:var(--green); color:var(--cream); padding:14px; border:none; width:100%; border-radius:8px; font-size:16px; cursor:pointer; margin-top:10px; }
 .btn:hover { background:#122e22; }
 .success { background:var(--green); color:var(--cream); padding:16px; border-radius:8px; display:none; }
</style>
</head>
<body>

<h1 style="color:var(--green)">The December Box<br>Gift Cards</h1>

<!-- BUY SECTION -->
<div class="card-box">
<h2>Buy a Gift Card</h2>
<label>Choose value</label>
<select id="faceValue">
  <option value="15">£15</option>
  <option value="25" selected>£25</option>
  <option value="50">£50</option>
  <option value="100">£100</option>
</select>

<label>Delivery</label>
<div class="toggle">
  <button id="btnDigital" class="active" onclick="setType('digital')">📧 Digital +£1<br><small>emailed as PDF</small></button>
  <button id="btnPosted" onclick="setType('posted')">💌 Posted +£2.50<br><small>luxe card + envelope</small></button>
</div>

<div id="breakdown">
  <div class="price-line"><span>Gift card value</span><span id="valText">£25.00</span></div>
  <div class="price-line"><span id="feeLabel">Digital delivery</span><span id="feeText">£1.00</span></div>
  <div class="price-line total"><span>You pay</span><span id="totalText">£26.00</span></div>
</div>

<input type="email" id="buyerEmail" placeholder="Recipient email (for digital) or your email">
<button class="btn" onclick="buyCard()">Buy Now</button>
<p style="font-size:12px; margin-top:10px;">You'll get a code like TDB-DIG-001. Add it to your <b>gift-cards.xlsx</b> and re-export <b>gift-cards.csv</b>.</p>
</div>

<!-- REDEEM SECTION -->
<div class="card-box">
<h2>Redeem a Gift Card</h2>
<form id="giftForm">
  <input type="text" id="cardNumber" placeholder="Enter code e.g. TDB-DIG-001" required>
  <button class="btn" type="submit">Check Balance</button>
</form>
<div id="success" class="success">
  <p>Code: <span id="codeOut"></span></p>
  <p class="balance" style="font-size:28px; font-weight:bold;"></p>
  <p>Available to spend on any December Box hamper</p>
</div>
</div>

<script>
let deliveryType = 'digital';
const fees = { digital: 1.00, posted: 2.50 };

function setType(type) {
  deliveryType = type;
  document.getElementById('btnDigital').classList.toggle('active', type==='digital');
  document.getElementById('btnPosted').classList.toggle('active', type==='posted');
  updatePrice();
}

function updatePrice() {
  const face = parseFloat(document.getElementById('faceValue').value);
  const fee = fees[deliveryType];
  document.getElementById('valText').textContent = '£'+face.toFixed(2);
  document.getElementById('feeLabel').textContent = deliveryType==='digital'? 'Digital delivery' : 'Print & post';
  document.getElementById('feeText').textContent = '£'+fee.toFixed(2);
  document.getElementById('totalText').textContent = '£'+(face+fee).toFixed(2);
}

document.getElementById('faceValue').addEventListener('change', updatePrice);
updatePrice();

function buyCard() {
  const face = document.getElementById('faceValue').value;
  const total = (parseFloat(face) + fees[deliveryType]).toFixed(2);
  const email = document.getElementById('buyerEmail').value;
  alert(`Order: £${face} ${deliveryType} card. Total £${total}. \\n\\nNext: Add a row to your gift-cards.xlsx:\\nCode: TDB-${deliveryType==='digital'?'DIG':'POST'}-XXX | Email: ${email} | Face: ${face} | Fee: ${fees[deliveryType]} | Total: ${total} | Balance: ${face} | YES`);
}

// REDEEM from gift-cards.csv
document.getElementById('giftForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = document.getElementById('cardNumber').value.trim();
  try {
    const res = await fetch('gift-cards.csv');
    const text = await res.text();
    const rows = text.split('\n').map(r => r.split(','));
    const found = rows.find(row => row[0] && row[0].trim() === code);
    if(found) {
      const balance = found[5] || found[3];
      const active = found[6] || found[4];
      if(active && active.toUpperCase().includes('YES')) {
        document.getElementById('codeOut').textContent = code;
        document.querySelector('.balance').textContent = '£' + balance + '.00 balance';
        document.getElementById('success').style.display = 'block';
      } else { alert('Card inactive'); }
    } else { alert('Code not found'); }
  } catch(err) { alert('Could not load gift-cards.csv - make sure file is in same folder'); }
});
</script>
</body>
</html>
