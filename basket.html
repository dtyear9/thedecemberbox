<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The December Box - basket</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap');

:root{
    --cream:#F5F0E7;
    --green:#2C4233;
    --gold:#C7A55C;
    --black:#111111;
    --white:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--cream);
    color:var(--black);
    font-family:'Lato',sans-serif;
    line-height:1.6;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    background:white;
    border-bottom:1px solid rgba(0,0,0,0.1);
    position:sticky;
    top:0;
    z-index:1000;
}

.logo img{
    height:85px;
    transition:0.3s;
}

.logo img:hover{
    transform:scale(1.03);
}

nav{
    display:flex;
    gap:25px;
}

nav a{
    color:var(--black);
    text-decoration:none;
    font-weight:600;
    transition:0.3s;
}

nav a:hover{
    color:var(--green);
}

.hero{
    min-height:75vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:50px 8%;
}

.hero h1{
    font-family:'Playfair Display',serif;
    font-size:4rem;
    margin-bottom:20px;
}

.hero p{
    max-width:650px;
    margin:auto;
    margin-bottom:30px;
    font-size:1.2rem;
}

.btn{
    display:inline-block;
    background:var(--green);
    color:white;
    padding:14px 28px;
    border-radius:6px;
    text-decoration:none;
    transition:0.3s;
}

.btn:hover{
    background:var(--gold);
    color:black;
}

section{
    padding:60px 8%;
}

h1,h2,h3{
    font-family:'Playfair Display',serif;
    margin-bottom:15px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
}

.product-card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
    transition:0.3s;
}

.product-card:hover{
    transform:translateY(-5px);
}

.product-card h2{
    margin-bottom:10px;
}

.price{
    color:var(--green);
    font-size:1.4rem;
    font-weight:700;
    margin:15px 0;
}

button{
    cursor:pointer;
    border:none;
    background:var(--green);
    color:white;
    padding:12px 18px;
    border-radius:6px;
    transition:0.3s;
}

button:hover{
    background:var(--gold);
    color:black;
}

form{
    max-width:700px;
}

input,
textarea{
    width:100%;
    padding:15px;
    margin-bottom:20px;
    border:1px solid #ddd;
    border-radius:6px;
}

textarea{
    min-height:180px;
}

.basket-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:white;
    padding:20px;
    margin-bottom:15px;
    border-radius:8px;
}

.total-box{
    margin-top:30px;
    background:white;
    padding:25px;
    border-radius:8px;
}

footer{
    text-align:center;
    padding:40px;
    background:var(--green);
    color:white;
    margin-top:50px;
}

.email-box{
    background:white;
    padding:20px;
    border-left:5px solid var(--gold);
    margin-bottom:30px;
}

@media(max-width:768px){

    header{
        flex-direction:column;
        gap:20px;
    }

    nav{
        flex-wrap:wrap;
        justify-content:center;
    }

    .hero h1{
        font-size:2.5rem;
    }
}
</style>
</head>
<body>

<header>
    <a href="index.html" class="logo">
        images/logo.png
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="hampers.html">Hampers</a>
        <a href="our-story.html">Our Story</a>
        <a href="returns.html">Returns</a>
        <a href="contact.html">Contact</a>
        <a href="basket.html">Basket</a>
    </nav>
</header>

<h1>Your Basket</h1>

<div id="basketItems"></div>

<h2>Total: £<span id="total">0.00</span></h2>

<button onclick="clearBasket()">Empty Basket</button>

<script>

let basket = JSON.parse(localStorage.getItem("basket")) || [];

let output = "";
let total = 0;

basket.forEach((item,index)=>{
output += `
<p>
${item.name} - £${item.price}
<button onclick="removeItem(${index})">Remove</button>
</p>
`;
total += item.price;
});

document.getElementById("basketItems").innerHTML = output;
document.getElementById("total").innerText = total.toFixed(2);

function removeItem(index){

basket.splice(index,1);

localStorage.setItem(
"basket",
JSON.stringify(basket)
);

location.reload();
}

function clearBasket(){

localStorage.removeItem("basket");

location.reload();
}

</script>
js/basket.jsscript>
</body>
</html>
